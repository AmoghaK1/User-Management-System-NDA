<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify Your Nrutyashree Dance Academy Account</title>
    <link rel="icon" type="image/png" href="../images/favicon-2.0.3/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="../images/favicon-2.0.3/favicon.svg" />
    <link rel="shortcut icon" href="../images/favicon-2.0.3/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="../images/favicon-2.0.3/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Nrutyashree" />
    <link rel="manifest" href="../images/favicon-2.0.3/site.webmanifest" />
    <style>
        body {
            font-family: 'Roboto', Arial, sans-serif;
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f6f9;
        }
        .email-container {
            background-color: rgba(206, 206, 206, 0.763);
            border-radius: 8px;
            padding: 35px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            text-align: center;
        }
        .logo {
            max-width: 180px;
            margin-bottom: 25px;
        }
        .verify-button {
            display: inline-block;
            background-color: #4a4a4a;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 500;
            margin-top: 20px;
            transition: background-color 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .verify-button:hover {
            background-color: #2c2c2c;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-weight: 300;
        }
        p {
            color: #666;
        }
        .link-text {
            margin-top: 25px;
            font-size: 12px;
            color: #888;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <img src="cid:natrajLogo" alt="Nrutyashree Logo" class="logo">
        <h1>Email Verification</h1>
        <p>Welcome to Nrutyashree Dance Academy. Please verify your email address to complete your registration.</p>
        <a href="{{verificationLink}}" class="verify-button">Verify Email</a>
        <p class="link-text">
            If the verification button doesn't work, copy and paste this link in your browser:<br>
            {{rawLink}}
        </p>
    </div>
</body>
</html>
