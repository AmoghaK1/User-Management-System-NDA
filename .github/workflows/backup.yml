name: Supabase Backup (Local Artifact)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 1,16 * *"

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          npm init -y
          npm install node-fetch@2 json2csv

      - name: Generate Backup Files
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node <<'EOF'
          const fetch = require("node-fetch")
          const { Parser } = require("json2csv")
          const fs = require("fs")

          const KEY = process.env.SUPABASE_SERVICE_ROLE_KEY
          const URL = process.env.SUPABASE_URL

          async function fetchTable(name){
            const res = await fetch(`${URL}/rest/v1/${name}?select=*`, {
              headers:{
                apikey: KEY,
                Authorization:`Bearer ${KEY}`
              }
            })
            const data = await res.json()
            if(!Array.isArray(data)) throw new Error("Failed: "+name)
            return data
          }

          async function run(){
            const users = await fetchTable("users")
            const payments = await fetchTable("payment_status")

            const parser = new Parser()
            const usersCSV = parser.parse(users)
            const paymentsCSV = parser.parse(payments)

            const date = new Date().toISOString().split("T")[0]

            fs.mkdirSync("backup", { recursive:true })
            fs.writeFileSync(`backup/users_${date}.csv`, usersCSV)
            fs.writeFileSync(`backup/payments_${date}.csv`, paymentsCSV)

            console.log("Backup files created 🎉")
          }

          run()
          EOF

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nrutyashree-backup
          path: backup
